<style>
  :root {
    --bg: #07050d;
    --panel: rgba(20, 11, 32, 0.94);
    --accent: #ff7a1a;
    --accent-ink: #1f0e00;
    --ink: #f6ecda;
    --muted: #b3a5c8;
    --line: rgba(255, 122, 26, 0.55);
    --blood: #c1121f;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Nunito, system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  body { position: fixed; inset: 0; }
  /* sized and positioned from JS; on phones held upright it is rotated 90° so the game is always landscape */
  #wrap { position: fixed; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 50% 50%; }
  #menuFab { position: absolute; top: .5em; left: .5em; z-index: 4; display: none; font-size: 1.1em; padding: .3em .7em; opacity: .85; }
  #rotateHint { position: absolute; left: 50%; bottom: .4em; transform: translateX(-50%); z-index: 4; display: none; font-size: .75em; font-weight: 800;
    color: var(--muted); background: rgba(0,0,0,.55); padding: .2em .7em; border-radius: 1em; pointer-events: none; white-space: nowrap; }
  body.rotated #rotateHint { display: block; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-size: 16px; }
  #ui > * { pointer-events: auto; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }

  button { font: inherit; font-weight: 800; cursor: pointer; border: none; border-radius: .5em;
    padding: .5em 1.1em; margin: .25em; background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 .2em 0 #9a4100; transition: transform .08s, filter .15s; }
  button:hover { filter: brightness(1.12); transform: translateY(-1px); }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #9a4100; }
  button.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
  button.danger { background: var(--blood); color: #fff; box-shadow: 0 .2em 0 #5e0008; }
  button.small { padding: .25em .6em; font-size: .85em; }
  button.sel { outline: 3px solid #fff; outline-offset: 1px; }

  .dlg { position: absolute; left: 50%; bottom: 1em; transform: translateX(-50%); width: min(46em, 92%);
    box-sizing: border-box; background: var(--panel); border: 2px solid var(--line); border-radius: .8em;
    padding: .9em 1.2em; box-shadow: 0 .5em 2em rgba(0,0,0,.6); }
  .dlg.side { left: auto; right: 1em; transform: none; width: min(36em, 66%); }
  .dlg .spk { font-family: Creepster, Nunito, cursive; color: var(--accent); font-size: 1.35em; letter-spacing: .04em; }
  .dlg .txt { font-size: 1.1em; line-height: 1.4; margin: .2em 0 .5em; min-height: 1.4em; }
  .dlg .btns { display: flex; flex-wrap: wrap; gap: .1em; }
  .dlg.creepy { background: rgba(0,0,0,.9); border-color: #4a0006; }
  .dlg.creepy .spk { color: var(--blood); font-size: 1.6em; }
  .dlg.creepy .txt { font-family: Georgia, serif; font-style: italic; color: #e7d5d5; letter-spacing: .03em; }
  .dlg.creepy button { background: #2a0004; color: #f3c9c9; box-shadow: 0 .2em 0 #000; border: 1px solid #6b0010; }

  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: .6em; align-items: center;
    padding: .5em .8em; pointer-events: none; }
  .hud .pill { background: rgba(10,5,18,.75); border: 1px solid var(--line); border-radius: 2em; padding: .25em .8em;
    font-weight: 900; font-size: 1em; white-space: nowrap; }
  .hud .grow { flex: 1; }
  .hud button { pointer-events: auto; }
  .prompt { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(10,5,18,.8);
    border: 1px solid var(--line); border-radius: .6em; padding: .4em .9em; font-weight: 800; pointer-events: none;
    text-align: center; }
  .prompt b { color: var(--accent); }
  .touch { position: absolute; bottom: .8em; left: .8em; right: .8em; display: none; justify-content: space-between; pointer-events: none; }
  body.is-touch .touch { display: flex; }
  .touch button { pointer-events: auto; font-size: 1.7em; width: 2.8em; height: 2.4em; padding: 0; opacity: .8; touch-action: none; }
  .touch > div { display: flex; gap: .4em; }

  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: min(40em, 92%); }
  .center p { color: var(--muted); }
  .warn { font-size: .85em; color: #ff9a9a !important; }

  .builder { position: absolute; right: 1em; top: 1em; bottom: 1em; width: 29em; background: var(--panel);
    border: 2px solid var(--line); border-radius: .8em; padding: .8em 1em; box-sizing: border-box;
    display: flex; flex-direction: column; gap: .5em; overflow-y: auto; }
  .builder h2 { margin: 0; font-family: Creepster, Nunito, cursive; color: var(--accent); font-weight: 400; font-size: 2em; letter-spacing: .04em; }
  .tabs { display: flex; gap: .2em; }
  .tabs button { flex: 1; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .3em; }
  .grid button { margin: 0; padding: .45em .2em; font-size: .9em; }
  .row { display: flex; align-items: center; gap: .3em; }
  .row .lab { width: 5em; color: var(--muted); font-weight: 800; font-size: .9em; }
  .row .val { flex: 1; text-align: center; font-weight: 900; background: rgba(255,255,255,.06); border-radius: .4em; padding: .35em 0; }
  .row button { margin: 0; padding: .3em .7em; }
  .swatches { display: flex; flex-wrap: wrap; gap: .3em; }
  .swatches button { width: 2em; height: 2em; padding: 0; margin: 0; border-radius: 50%; box-shadow: none; border: 2px solid rgba(255,255,255,.3); }
  .builder input { width: 100%; box-sizing: border-box; font: inherit; font-weight: 800; padding: .4em .6em; border-radius: .4em;
    border: 1px solid var(--line); background: rgba(0,0,0,.4); color: var(--ink); }
  .builder label { color: var(--muted); font-weight: 800; font-size: .9em; }
  .chips { display: flex; flex-wrap: wrap; gap: .3em; }
  .chip { font-size: .8em; font-weight: 900; padding: .15em .6em; border-radius: 1em; background: rgba(255,255,255,.1); }
  .hint { font-size: .8em; color: var(--muted); line-height: 1.35; }
  .spacer { flex: 1; }

  .end { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: var(--panel);
    border: 2px solid var(--line); border-radius: .8em; padding: 1em 1.6em; text-align: center; width: min(30em, 90%);
    max-height: 94%; overflow-y: auto; box-sizing: border-box; }
  .end h1 { font-family: Creepster, Nunito, cursive; font-weight: 400; color: var(--accent); margin: 0 0 .2em; font-size: 2.6em; letter-spacing: .04em; }
  .end .big { font-size: 2.2em; font-weight: 900; }
  .end table { margin: .6em auto; border-collapse: collapse; }
  .end td { padding: .15em .7em; text-align: left; }
  .end td:last-child { text-align: right; font-weight: 900; }

  .mghud { position: absolute; top: .6em; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 1.3em;
    background: rgba(0,0,0,.6); padding: .2em .9em; border-radius: 2em; border: 1px solid var(--line); pointer-events: none; white-space: nowrap; }

  .goals { position: absolute; left: .8em; top: 3.1em; background: rgba(10,5,18,.72); border: 1px solid var(--line); border-radius: .6em;
    padding: .35em .7em; font-size: .78em; font-weight: 800; pointer-events: none !important; line-height: 1.5; }
  .goals .gt { color: var(--accent); font-weight: 900; }
  .goals .done { color: #8fdc8f; text-decoration: line-through; }
  .toast { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); background: rgba(20,60,20,.9); border: 1px solid #8fdc8f;
    border-radius: .6em; padding: .4em 1em; font-weight: 800; opacity: 0; transition: opacity .4s; pointer-events: none !important; white-space: nowrap; }
  .unlocks { font-size: .8em; background: rgba(255,255,255,.05); border-radius: .5em; padding: .4em .6em; }
  .unlocks summary { cursor: pointer; font-weight: 900; color: var(--accent); }
  .unlocks .u { display: flex; justify-content: space-between; gap: .5em; padding: .15em 0; color: var(--muted); }
  .unlocks .u.got { color: #8fdc8f; }
  .newunlock { color: #ffd60a; font-weight: 900; }
  .pausebox.wide { width: min(46em, 94%); }
  .center:has(.jbox) { width: min(46em, 94%); }
  .helpbox.jbox { max-height: 32em; }
  .journal { text-align: left; }
  .journal h1 { text-align: center; font-family: Creepster, Nunito, cursive; font-weight: 400; color: var(--accent); margin: 0; font-size: 2.2em; letter-spacing: .05em; }
  .journal .jsub { text-align: center; color: var(--muted); font-weight: 800; margin-bottom: .4em; }
  .journal h3 { margin: .7em 0 .3em; color: var(--accent); font-family: Creepster, Nunito, cursive; font-weight: 400; font-size: 1.4em; letter-spacing: .04em; }
  .journal h3 span { font-family: Nunito, sans-serif; font-size: .6em; color: var(--muted); }
  .jgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; }
  .jcard { display: flex; gap: .55em; align-items: flex-start; background: rgba(255,255,255,.05); border-radius: .5em; padding: .4em; }
  .jcard.unknown { opacity: .55; }
  .jcard .portrait { width: 4.2em; height: 4.2em; border-radius: .4em; flex: none; border: 1px solid rgba(255,255,255,.15); }
  .jinfo { font-size: .8em; line-height: 1.3; }
  .jinfo b { font-size: 1.05em; }
  .jinfo .jm { color: #ffd6a0; font-weight: 800; font-size: .92em; margin: .1em 0; }
  .jinfo .jd { color: var(--muted); }
  .journal > button { display: block; margin: .8em auto .2em; }
  @media (max-width: 700px) { .jgrid { grid-template-columns: 1fr; } }
  .pause { position: absolute; inset: 0; background: rgba(5,2,10,.72); backdrop-filter: blur(3px); display: flex;
    align-items: center; justify-content: center; font-size: inherit; z-index: 5; }
  .pausebox { background: var(--panel); border: 2px solid var(--line); border-radius: .8em; padding: 1em 1.6em; text-align: center;
    width: min(26em, 88%); max-height: 90%; overflow-y: auto; box-sizing: border-box; }
  .pausebox h1 { font-family: Creepster, Nunito, cursive; font-weight: 400; color: var(--accent); margin: 0 0 .2em; font-size: 2.4em; letter-spacing: .05em; }
  .pausebox button { min-width: 13em; }
  .pstats { font-weight: 900; margin-bottom: .5em; }
  .helpbox { background: var(--panel); border: 2px solid var(--line); border-radius: .8em; padding: .6em 1.2em; text-align: left;
    max-height: 30em; overflow-y: auto; font-size: .92em; line-height: 1.4; margin-top: .6em; }
  .helpbox h3 { margin: .2em 0; font-family: Creepster, Nunito, cursive; font-weight: 400; color: var(--accent); font-size: 1.6em; letter-spacing: .04em; }
  .helpbox p { color: var(--ink) !important; margin: .45em 0; }
  .helpbox button { display: block; margin: .6em auto .2em; }
  kbd { display: inline-block; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-bottom-width: 3px;
    border-radius: .3em; padding: 0 .35em; font-family: inherit; font-weight: 900; font-size: .9em; margin: 0 .1em; }
  @media (max-width: 700px) { .builder { width: 24em; } }
</style>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui"></div>
  <div id="flash"></div>
  <button id="menuFab" aria-label="Menu">☰</button>
  <div id="rotateHint">↻ Turn your phone sideways for the best view</div>
</div>
<script>
'use strict';
// ============================================================
//  CORE
// ============================================================
const W = 960, H = 540;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d'); // swapped temporarily when drawing journal portraits
const ui = document.getElementById('ui');
const wrap = document.getElementById('wrap');
const flashEl = document.getElementById('flash');
const menuFab = document.getElementById('menuFab');
const rotateHint = document.getElementById('rotateHint');
const S = (window.devicePixelRatio || 1) > 1 ? 2 : 1;
// phones and tablets get touch controls, touch wording and forced landscape
// (primary pointer is a finger — touchscreen laptops with a mouse/trackpad keep the desktop controls)
const IS_TOUCH = (!!window.matchMedia && (matchMedia('(pointer: coarse)').matches || (matchMedia('(hover: none)').matches && navigator.maxTouchPoints > 0)))
  || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports itself as a Mac
if (IS_TOUCH) document.body.classList.add('is-touch');
const KNOCK_HINT = IS_TOUCH ? 'Tap 🚪 or the house' : '↑ / E';
cv.width = W * S; cv.height = H * S;

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TAU = Math.PI * 2;

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); ctx.fill(); }
function circ(x, y, r) { ell(x, y, r, r); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, amt) {
  const [r, g, b] = hexRgb(hex); const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return `rgb(${Math.round((f - r) * p + r)},${Math.round((f - g) * p + g)},${Math.round((f - b) * p + b)})`;
}
function lum(hex) { const [r, g, b] = hexRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

function flash(color, ms = 300) {
  flashEl.style.transition = 'none'; flashEl.style.background = color; flashEl.style.opacity = '1';
  requestAnimationFrame(() => requestAnimationFrame(() => { flashEl.style.transition = `opacity ${ms}ms`; flashEl.style.opacity = '0'; }));
}

// film grain for scary scenes
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'); const id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 50; }
  g.putImageData(id, 0, 0); }
function drawGrain(a) {
  ctx.save(); ctx.globalAlpha = a; const ox = -randi(0, 255), oy = -randi(0, 255);
  for (let x = ox; x < W; x += 256) for (let y = oy; y < H; y += 256) ctx.drawImage(grain, x, y);
  ctx.restore();
}
function vignette(strength, color = '0,0,0') {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glitch(n, maxShift) {
  for (let i = 0; i < n; i++) {
    const y = randi(0, H - 10), h = randi(4, 50), dx = randi(-maxShift, maxShift);
    ctx.drawImage(cv, 0, y * S, W * S, h * S, dx, y, W, h);
  }
}

// ============================================================
//  AUDIO (all synthesized)
// ============================================================
const SFX = {
  ac: null, master: null, amb: null, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.6; this.master.connect(this.ac.destination);
  },
  get ok() { return !!this.ac; },
  t() { return this.ac.currentTime; },
  setMuted(m) {
    this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.6, this.t(), 0.05);
    SAVE.settings.muted = m; writeSave();
  },
  tone(f, d, type = 'sine', v = 0.2, f2 = null, delay = 0) {
    if (!this.ok) return; const t = this.t() + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noiseBuf() {
    if (this._nb) return this._nb;
    const b = this.ac.createBuffer(1, this.ac.sampleRate * 2, this.ac.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return (this._nb = b);
  },
  noise(d, v = 0.2, freq = 1000, ftype = 'bandpass', q = 1, delay = 0, freq2 = null) {
    if (!this.ok) return; const t = this.t() + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + d);
    const g = this.ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + d + 0.05);
  },
  click() { this.tone(900, 0.05, 'square', 0.05); },
  step() { this.noise(0.07, 0.04, 260, 'lowpass'); },
  knock() { for (let i = 0; i < 3; i++) { this.noise(0.09, 0.6, 160, 'lowpass', 1, i * 0.2); this.tone(90, 0.08, 'sine', 0.3, 60, i * 0.2); } },
  bell() { this.tone(659, 0.7, 'sine', 0.2); this.tone(1318, 0.4, 'sine', 0.04); this.tone(523, 1.0, 'sine', 0.2, null, 0.4); this.tone(1046, 0.5, 'sine', 0.04, null, 0.4); },
  candy() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.14, null, i * 0.06)); },

// The storage key never changes between game updates. New fields get defaults when an older save is
// loaded, unknown fields are kept, and anything that no longer exists (a removed costume part) is
// cleaned up on use — so updating the game never wipes progress.
const SAVE_KEY = 'trick-or-treat-save-v1';
const SAVE_VERSION = 2;
function defaultSave() {
  return { version: SAVE_VERSION, nights: 0, totalCandy: 0, best: 0, brave: 0, dogEscapes: 0, fullsize: 0, goals: 0, housesTotal: 0, minigames: 0, mimicEscapes: 0,
    unlocked: [], seen: [], outfits: [], settings: { terror: true, muted: false }, lastCostume: null, lastName: null };
}
function normalizeSave(s) {
  const d = defaultSave();
  if (!s || typeof s !== 'object') return d;
  const out = Object.assign(d, s);
  out.settings = Object.assign(defaultSave().settings, s.settings && typeof s.settings === 'object' ? s.settings : {});
  ['unlocked', 'seen', 'outfits'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  ['nights', 'totalCandy', 'best', 'brave', 'dogEscapes', 'fullsize', 'goals', 'housesTotal', 'minigames', 'mimicEscapes'].forEach(k => { out[k] = Number(out[k]) || 0; });
  out.outfits = out.outfits.filter(o => o && o.costume && typeof o.costume === 'object').slice(0, 24);
  // migrations from older save versions go here (v1 had no outfits/settings: handled by the defaults above)
  out.version = SAVE_VERSION;
  return out;
}
function loadSave() {
  try { return normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); } catch (e) { return defaultSave(); }
}
let SAVE = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* storage unavailable */ } }

function sanitizeCostume(c) {
  const def = PREMADE[0], out = {};
  ['head', 'hat', 'body', 'extra'].forEach(k => { out[k] = c && availParts(k).some(p => p.id === c[k]) ? c[k] : def[k]; });
  out.color = c && availColors().some(x => x.id === c.color) ? c.color : def.color;
  return out;
}
function exportSave() {
  const blob = new Blob([JSON.stringify(SAVE, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'trick-or-treat-save.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importSave(onDone) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { SAVE = normalizeSave(JSON.parse(rd.result)); writeSave(); applySavedSettings(); onDone(true); }
      catch (e) { onDone(false); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function drawLamp(x, gy, t, flicker) {
  ctx.fillStyle = '#15121a'; ctx.fillRect(x - 3, gy - 170, 6, 170); ctx.fillRect(x - 3, gy - 170, 26, 5);
  let on = true; if (flicker) on = Math.random() > 0.25 && Math.sin(t * 17 + x) > -0.6;
  if (on) {
    const g = ctx.createRadialGradient(x + 20, gy - 160, 2, x + 20, gy - 100, 140);
    g.addColorStop(0, 'rgba(255,230,160,0.4)'); g.addColorStop(1, 'rgba(255,230,160,0)');
    ctx.fillStyle = g; poly([x + 14, gy - 162, x + 26, gy - 162, x + 90, gy + 20, x - 50, gy + 20]);
    ctx.fillStyle = '#fff4cf'; circ(x + 20, gy - 162, 5);
  } else { ctx.fillStyle = '#333'; circ(x + 20, gy - 162, 5); }
  return on;
}

const FOG = [...Array(18)].map(() => ({ x: Math.random() * W * 2, y: rand(380, 520), r: rand(80, 180), s: rand(6, 20) }));
function drawFog(t, dens = 1, camx = 0) {
  FOG.forEach(f => {
    const x = ((f.x + t * f.s - camx * 0.6) % (W + 400) + W + 400) % (W + 400) - 200;
    const g = ctx.createRadialGradient(x, f.y, 0, x, f.y, f.r); g.addColorStop(0, `rgba(170,160,200,${0.09 * dens})`); g.addColorStop(1, 'rgba(170,160,200,0)');
    ctx.fillStyle = g; circ(x, f.y, f.r);
  });
}

let typeTimer = null;
function dialog({ speaker, text, buttons = [], cls = '', type = false, speed = 28, onTyped }) {
  ui.querySelectorAll('.dlg').forEach(e => e.remove()); clearInterval(typeTimer);
  const d = el('div', 'dlg ' + cls + (scene && scene.dlgSide ? ' side' : ''));
  d.innerHTML = `${speaker ? `<div class="spk">${speaker}</div>` : ''}<div class="txt"></div><div class="btns"></div>`;
  const tx = d.querySelector('.txt'), bx = d.querySelector('.btns');
  const addButtons = () => buttons.forEach(([label, fn, k]) => { const b = el('button', k || ''); b.textContent = label; b.onclick = () => { SFX.click(); fn(); }; bx.appendChild(b); });
  if (type) {
    let i = 0; const plain = text;
    typeTimer = setInterval(() => {
      if (paused) return;
      i++; tx.textContent = plain.slice(0, i);
      if (i >= plain.length) { clearInterval(typeTimer); addButtons(); onTyped && onTyped(); }
    }, speed);
  } else { tx.innerHTML = text; addButtons(); }
  ui.appendChild(d); return d;
}
function clearDialog() { clearInterval(typeTimer); ui.querySelectorAll('.dlg').forEach(e => e.remove()); }

// ---------- PAUSE MENU (Esc) ----------
let paused = false, pauseEl = null;
function openPause() {
  if (paused || !scene || scene.isTitle) return;
  paused = true; for (const k in keys) keys[k] = false; for (const k in vkeys) vkeys[k] = false;
  if (SFX.ac) SFX.ac.suspend();
  pauseEl = el('div', 'pause'); pauseEl.style.fontSize = ui.style.fontSize;
  const box = el('div', 'pausebox');
  const inNight = G.houses.length && !(scene.isBuilder || scene.isEnd);
  box.innerHTML = `<h1>Paused</h1>${inNight ? `<div class="pstats">🍬 ${G.candy} candy · 🕕 ${fmtTime(G.time)}</div>` : ''}`;
  const btn = (label, fn, cls) => { const b = el('button', cls || 'ghost', label); b.onclick = () => { fn(); }; box.appendChild(b); box.appendChild(el('br')); return b; };
  btn('▶ Resume', closePause, '');
  if (inNight) btn('🔄 Restart Night', () => confirmThen('Restart the night? You\'ll lose all your candy.', () => { closePause(); newGame(); setScene(streetScene()); }));
  if (!scene.isBuilder) btn('🎭 Change Costume', () => confirmThen(inNight ? 'Change costume? This ends your current night.' : null, () => { closePause(); setScene(builderScene()); }));
  btn('🏠 Main Menu', () => confirmThen(inNight ? 'Quit to the main menu? Your night will be lost.' : null, () => { closePause(); setScene(titleScene()); }));
  btn('📖 Encounters', () => { box.innerHTML = ''; box.classList.add('wide'); box.appendChild(buildJournal(() => { closePause(); openPause(); })); });
  btn('💾 Save Data', () => { box.innerHTML = ''; box.appendChild(saveDataPanel(() => { closePause(); openPause(); })); });
  btn('📜 How to Play', () => { box.querySelector('.helpbox')?.remove(); const hb = el('div', 'helpbox', HELP_HTML); box.appendChild(hb); });
  const tb = terrorButton(); box.appendChild(tb); box.appendChild(el('br'));
  const mb = el('button', 'ghost'); const setM = () => mb.textContent = SFX.muted ? '🔇 Sound: Off' : '🔊 Sound: On'; setM();
  mb.onclick = () => { SFX.setMuted(!SFX.muted); setM(); }; box.appendChild(mb);
  box.appendChild(el('div', 'hint', 'Press Esc to resume'));
  pauseEl.appendChild(box); wrap.appendChild(pauseEl);
  function confirmThen(msg, fn) {
    if (!msg) return fn();
    box.innerHTML = `<h1>Are you sure?</h1><p>${msg}</p>`;
    const y = el('button', 'danger', 'Yes'); y.onclick = fn;
    const n = el('button', 'ghost', 'No'); n.onclick = () => { closePause(); openPause(); };
    box.append(y, n);
  }
}
function closePause() {
  if (!paused) return;
  paused = false; if (pauseEl) pauseEl.remove(); pauseEl = null;
  if (SFX.ac) SFX.ac.resume();
  last = performance.now();
}

  if (s.isTitle || s.isBuilder) { MUSIC.start(); SFX.silence(true); } else MUSIC.stop(); // music on the menus, night ambience in-game

}

function firstGesture(e) {

  if (IS_TOUCH && !triedFullscreen && e && e.type === 'pointerdown') { triedFullscreen = true; goFullscreen(); }
}

        const sd = el('button', 'ghost', '💾 Save Data'); sd.onclick = () => { SFX.init(); SFX.click(); c.style.top = '50%'; c.innerHTML = ''; c.appendChild(saveDataPanel(showMain)); };

// ---------- STREET ----------
function streetScene() {
  let t = 0, stepT = 0, hud, prompt, nearH = null, watcher = null, watcherCD = rand(12, 22), lastCandy = -1, lastTime = -1;
  let goalsEl, toastEl, toastT = 0, stalk = null, stalkCD = rand(10, 18), frozen = !G.introShown;
  let walkTo = null, autoKnock = null;
  const GY = 430, PY = 452;
  const els = {};
  function renderGoals() {
    goalsEl.innerHTML = `<div class="gt">Tonight's goals</div>` + G.goals.map(g => `<div class="${G.goalsDone.has(g.id) ? 'done' : ''}">${G.goalsDone.has(g.id) ? '✅' : '⬜'} ${g.text}</div>`).join('');
  }
  function toast(html) { toastEl.innerHTML = html; toastEl.style.opacity = '1'; toastT = 3; }
  function showIntro() {
    const modTxt = `<b>${G.mod.name}</b><br><span style="color:var(--muted)">${G.mod.desc}</span>`;
    dialog({ speaker: `Welcome to ${G.street}`, text: `${modTxt}<br><br><b>Tonight's goals</b> (+10 candy each):<br>${G.goals.map(g => '⬜ ' + g.text).join('<br>')}<br><br><span style="color:var(--muted)">${G.houses.length} houses · ${G.houses.filter(h => h.scary).length} look... wrong. The night ends at ${fmtTime(G.endTime)}.</span>`,
      buttons: [["Let's go! 🎃", () => { clearDialog(); G.introShown = true; frozen = false; }]] });
  }
  function goHome() { setScene(endScene('home')); }
  function knock() {
    if (!nearH || nearH.visited) return;
    setScene(nearH.scary ? scaryScene(nearH) : doorScene(nearH));
  }
  return {
    enter() {
      SFX.startAmb(); SFX.silence(false);
      hud = el('div', 'hud');
      els.candy = el('span', 'pill'); els.time = el('span', 'pill'); els.name = el('span', 'pill'); els.houses = el('span', 'pill');
      const gh = el('button', 'ghost small', '🏠 Go Home'); gh.onclick = () => { SFX.click(); goHome(); };
      const mn = el('button', 'ghost small', '☰ Menu'); mn.onclick = () => { SFX.click(); openPause(); };
      hud.append(els.candy, els.time, els.houses, el('span', 'grow'), els.name, muteButton(), gh, mn);
      ui.appendChild(hud);
      prompt = el('div', 'prompt'); prompt.style.display = 'none'; ui.appendChild(prompt);
      const tc = el('div', 'touch');
      const mk = (label, key) => { const b = el('button', null, label);
        b.onpointerdown = e => { e.preventDefault(); SFX.init(); if (key === 'knock') knock(); else vkeys[key] = true; };
        b.onpointerup = b.onpointerleave = b.onpointercancel = () => { vkeys[key] = false; }; return b; };
      const lr = el('div'); lr.style.pointerEvents = 'none'; lr.append(mk('◀', 'left'), mk('▶', 'right'));
      tc.append(lr, mk('🚪', 'knock')); ui.appendChild(tc);
      goalsEl = el('div', 'goals'); ui.appendChild(goalsEl);
      toastEl = el('div', 'toast'); ui.appendChild(toastEl);
      checkGoals(); renderGoals();
      if (frozen) showIntro();
    },
    isStreet: true,
    exit() { vkeys.left = vkeys.right = false; },
    key(k) { walkTo = null; autoKnock = null; if (!frozen && ['arrowup', 'w', 'e', ' ', 'enter'].includes(k)) knock(); },
    // tap/click the street to walk there; tap a house to walk up and knock
    click(x, y) {
      if (frozen) return;
      const camx = clamp(G.px - W / 2, 0, G.LEN - W), wx = camx + x;
      const h = y < GY + 4 ? G.houses.find(hh => Math.abs(hh.x - wx) < hh.w / 2 && y > GY - hh.h - 120) : null;
      if (h) {
        if (Math.abs(h.x - G.px) < 55) { nearH = h; knock(); return; }
        walkTo = h.x; autoKnock = h.visited ? null : h;
      } else { walkTo = clamp(wx, 60, G.LEN - 40); autoKnock = null; }
    },
    update(dt) {
      t += dt;
      if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.style.opacity = '0'; }
      const newly = checkGoals();
      if (newly.length) { renderGoals(); SFX.win(); toast(`✅ Goal complete: <b>${newly[0].text}</b>`); }
      let mv = 0;
      if (!frozen && (keys.arrowleft || keys.a || vkeys.left)) mv -= 1;
      if (!frozen && (keys.arrowright || keys.d || vkeys.right)) mv += 1;
      if (mv) { walkTo = null; autoKnock = null; }
      else if (walkTo !== null && !frozen) {
        const d = walkTo - G.px;
        if (Math.abs(d) < 6) {
          walkTo = null;
          if (autoKnock) { const h = autoKnock; autoKnock = null; nearH = h; knock(); return; }
        } else mv = Math.sign(d);
      }
      if (mv) { G.dir = mv; G.px = clamp(G.px + mv * 230 * dt, 60, G.LEN - 40); stepT += dt; if (stepT > 0.28) { stepT = 0; SFX.step(); } }
      G.walking = !!mv;
      nearH = G.houses.find(h => Math.abs(h.x - G.px) < 55) || null;
      // dread
      let dread = 0;
      G.houses.forEach(h => { if (h.scary && !h.visited) dread = Math.max(dread, 1 - Math.abs(h.x - G.px) / 500); h.figT -= dt; if (h.figT < 0) { h.fig = h.fig > 0 ? 0 : 1; h.figWin = randi(0, 3); h.figT = h.fig ? rand(0.4, 1.5) : rand(4, 12); } });
      if (stalk) dread = Math.max(dread, 0.8);
      this.dread = clamp(dread, 0, 1); SFX.setDread(this.dread);
      // a tall figure down the street that vanishes when you get close
      watcherCD -= dt;
      const unvisited = G.houses.filter(h => h.scary && !h.visited);
      if (!frozen && !watcher && watcherCD <= 0 && unvisited.length) {
        const wx = G.px + G.dir * rand(380, 470);
        if (wx > 100 && wx < G.LEN - 100) { watcher = { x: wx, life: rand(2.5, 4), v: pick(unvisited).res }; SFX.sting(); }
        watcherCD = rand(18, 35);
      }
      if (watcher) { watcher.life -= dt; if (watcher.life <= 0 || Math.abs(watcher.x - G.px) < 200) watcher = null; }
      // something you ran from is following you. It's only there when you aren't looking.
      if (G.stalker && !frozen) {
        stalkCD -= dt;
        if (!stalk && stalkCD <= 0 && G.walking) { stalk = { side: -G.dir, dist: rand(170, 230), life: rand(2.2, 3.5) }; SFX.breath(); }
        if (stalk) {
          stalk.life -= dt;
          if (G.walking && G.dir === stalk.side) { stalk = null; SFX.sting(); stalkCD = rand(14, 26); } // you turned around: gone
          else if (stalk.life <= 0) { stalk = null; stalkCD = rand(14, 26); }
        }
      }
      // HUD
      if (G.candy !== lastCandy) { els.candy.textContent = `🍬 ${G.candy}`; lastCandy = G.candy; }
      if (G.time !== lastTime) { els.time.textContent = `🕕 ${fmtTime(G.time)}`; lastTime = G.time; }
      els.houses.textContent = `🏠 ${G.houses.filter(h => h.visited).length}/${G.houses.length}`;
      els.name.textContent = `🎭 ${costumeName()}`;
      if (nearH) {
        prompt.style.display = '';
        if (nearH.visited) prompt.innerHTML = nearH.scary ? `<span style="color:#c1121f">The door is shut. Something is breathing behind it.</span>` : `Already visited <b>${nearH.res.name}</b>`;
        else if (nearH.scary) prompt.innerHTML = `<span style="color:#c9b6b6">A ${HAUNT_STYLES[nearH.style].name}. Completely silent.</span><br><b>${KNOCK_HINT}</b> to knock <span style="color:#c1121f">(if you dare)</span>`;
        else if (nearH.bowl) prompt.innerHTML = `The lights are on, but nobody's home...<br><b>${KNOCK_HINT}</b> to knock`;
        else prompt.innerHTML = `<b>${nearH.res.name}</b>'s house${nearH.dog ? `<br><span style="color:#ffd60a">⚠ Beware of ${nearH.dogName}!</span>` : ''}<br><b>${KNOCK_HINT}</b> to knock`;
      } else prompt.style.display = 'none';
      if (G.px >= G.LEN - 45) setScene(endScene('street'));
    },
    draw() {
      const camx = clamp(G.px - W / 2, 0, G.LEN - W);
      drawSky(t, camx, G.mod.id === 'blood');
      drawFarTrees(camx, GY - 20);
      ctx.save(); ctx.translate(-camx, 0);
      // lawn
      ctx.fillStyle = '#141a14'; ctx.fillRect(camx, GY - 20, W, 22);
      G.houses.forEach(h => { if (h.x > camx - 400 && h.x < camx + W + 400) drawHouse(h, h.x, GY, t, h === nearH); });
      // sidewalk & street
      ctx.fillStyle = '#3a3640'; ctx.fillRect(camx, GY, W, 34);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; for (let x = Math.floor(camx / 60) * 60; x < camx + W; x += 60) line(x, GY, x, GY + 34);
      ctx.fillStyle = '#1b1a20'; ctx.fillRect(camx, GY + 34, W, H);
      ctx.fillStyle = '#5a5530'; for (let x = Math.floor(camx / 90) * 90; x < camx + W; x += 90) ctx.fillRect(x, GY + 78, 44, 4);
      // paths
      G.houses.forEach(h => { ctx.fillStyle = '#4a4550'; ctx.fillRect(h.x - 20, GY - 2, 40, 4); });
      // start / end markers
      ctx.fillStyle = '#ffd60a'; ctx.font = '900 16px Nunito'; ctx.textAlign = 'center'; ctx.fillText('🏠 HOME', 80, GY - 30);
      ctx.fillText('END OF STREET →', G.LEN - 120, GY - 30);
      // watcher
      if (watcher) { ctx.globalAlpha = Math.min(1, watcher.life) * 0.9; drawTallFigure(watcher.x, PY + 6, 0.42, watcher.v, t, false); ctx.globalAlpha = 1; }
      if (stalk) {
        const sx = G.px + stalk.side * stalk.dist;
        ctx.globalAlpha = Math.min(1, stalk.life * 2) * 0.95;
        drawTallFigure(sx, PY + 6, 0.38, G.stalker, t, true);
        ctx.globalAlpha = 1;
      }
      // player
      drawCostume(G.costume, G.px, PY + 8, 0.82, t, G.walking, G.dir);
      // lamps (foreground), one between each pair of houses
      for (let i = 0; i <= G.houses.length; i++) {
        const lx = i === 0 ? G.houses[0].x - 240 : i === G.houses.length ? G.houses[i - 1].x + 240 : (G.houses[i - 1].x + G.houses[i].x) / 2;
        if (lx < camx - 100 || lx > camx + W + 100) continue;
        const flick = !!stalk || G.houses.some(h => h.scary && !h.visited && Math.abs(h.x - lx) < 300);
        drawLamp(lx, GY + 34, t, flick);
      }
      ctx.restore();
      const dr = this.dread || 0;
      drawFog(t, (G.mod.id === 'fog' ? 3.2 : 1) + dr * 1.2, camx);
      if (dr > 0) { ctx.fillStyle = `rgba(4,6,4,${dr * 0.5})`; ctx.fillRect(0, 0, W, H); }
      vignette(0.55 + dr * 0.4);
      if (this.dread > 0.4) drawGrain((this.dread - 0.4) * 0.6);
    },
  };
}

function finishHouse(h) {
  h.visited = true; G.stats.visited++; G.time += 20;
  G.stats.best = Math.max(G.stats.best, G.candy);
  if (G.time >= G.endTime || G.houses.every(x => x.visited)) setScene(endScene('time'));
  else setScene(streetScene());
}
function loseCandy(frac) { const n = Math.ceil(G.candy * frac); G.candy -= n; G.stats.lost += n; return n; }

// ---------- NORMAL DOOR ----------
function doorScene(h) {
  const r = h.res; let t = 0, door = 0, opening = false, mood = 1, parts = [], shake = 0;
  // grandma house state: gran.phase = twitch → split → lunge (or escaped); js = jump scare timer
  let gran = null, js = 0, black = 0, jsDone = null, heart = 0, hbT = 0;
  const pendingTimers = [];
  const later = (s, fn) => pendingTimers.push({ at: t + s, fn });
  const GM = GRANNY_MONSTER;
  const self = {
    phase: 'knock', dlgSide: true,
    exit() { SFX.silence(false); },
    grannyGreet() {
      dialog({ speaker: r.name, text: pick(["Oh my stars, look at you! Aren't you just the most precious little thing?", "Well hello, sweetheart! Grandma's been waiting all night for a visitor.", 'Oh, come here, come here, let Grandma get a good look at you!']),
        buttons: [['🎃 "Trick or treat!"', () => self.grannyTreat()]] });
    },
    grannyTreat() {
      const n = Math.round(8 * treatMul()); addTreat(n, true); SFX.candy(); self.burst(n);
      dialog({ speaker: r.name, text: `"Here you go, dear. The good stuff." 🍬 <b>+${n} candy</b><br><br>"Would you like to come inside? I just pulled a batch of cookies out of the oven. They're still <i>warm</i>."`,
        buttons: [['Go inside for cookies', () => self.grannyTurn(false)], ['No thanks, I have to go', () => self.grannyTurn(true)]] });
    },
    grannyTurn(refused) {
      gran = { phase: 'twitch', t: 0, lt: 0, canRun: false };
      SFX.silence(true); heart = 0.7; SFX.crack();
      dialog({ speaker: r.name, cls: 'creepy', type: true, speed: 45,
        text: refused ? "\"That's alright, dear.\" Her smile doesn't move. \"Grandma will just... come... to you.\"" : '"Wonderful." Her smile gets wider. And wider. "Grandma has been so... very... HUNGRY."' });
      later(1.0, () => SFX.crack()); later(1.7, () => { SFX.crack(); SFX.whisper(1.5); });

function minigameScene(kind, done, opts = {}) {
  const m = MG[kind](opts); let started = false, over = false, t = 0, hudEl;
  return {
    enter() {
      dialog({ speaker: m.title, text: m.desc, buttons: [['Start!', () => { clearDialog(); started = true; mouse.moved = false; hudEl = el('div', 'mghud'); ui.appendChild(hudEl); }]] });
    },
    key(k) { if (started && !over && m.key) m.key(k); },
    click(x, y) { if (started && !over && m.click) m.click(x, y); },
    update(dt) {
      t += dt;
      if (started && !over) {
        const r = m.update(dt);
        if (hudEl) hudEl.textContent = m.hud();
        if (r === true || r === false) {
          over = true; if (hudEl) hudEl.remove();
          if (r) { SFX.win(); G.stats.minigamesWon++; } else { SFX.lose(); G.stats.minigamesLost++; }
          const res = m.onEnd ? m.onEnd(r) : null;
          dialog({ speaker: res ? res.title : (r ? 'YOU WIN!' : 'YOU LOSE!'), text: res ? res.text : (r ? 'Trick dodged! Your candy is safe.' : 'Oof. That trick got you.'), buttons: [['Continue →', () => done(r)]] });
        }
      }
    },
    draw() { m.draw(t); if (!started) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H); } vignette(0.5); },
  };
}

  const before = new Set(SAVE.unlocked);
  SAVE.nights++; SAVE.totalCandy += G.candy; SAVE.best = Math.max(SAVE.best, G.candy);
  SAVE.brave += G.stats.brave; SAVE.dogEscapes += G.stats.dogEscaped; SAVE.fullsize += G.stats.fullsize; SAVE.goals += G.goalsDone.size;
  SAVE.housesTotal += G.stats.visited; SAVE.minigames += G.stats.minigamesWon; SAVE.mimicEscapes += G.stats.mimicEscaped;
  UNLOCKS.forEach(u => { const [cur, need] = u.prog(SAVE); if (cur >= need && !SAVE.unlocked.includes(u.id)) SAVE.unlocked.push(u.id); });
  const fresh = UNLOCKS.filter(u => SAVE.unlocked.includes(u.id) && !before.has(u.id));
  const newBest = G.candy > 0 && G.candy === SAVE.best;
  writeSave();
  let t = 0; const piles = [...Array(Math.min(160, G.candy))].map(() => ({ x: rand(380, 580), y: 0, c: pick(['#ff3b6b', '#4cc9f0', '#ffd60a', '#80ed99', '#c77dff', '#ff7a1a']), r: rand(0, 6) }));
  piles.forEach((p, i) => { p.y = 470 - Math.sqrt(i) * 7 - Math.max(0, 40 - Math.abs(p.x - 480)) * 0.1; });
  const ranks = [[0, 'Sad Little Ghost', '👻'], [15, 'Candy Collector', '🍬'], [40, 'Sugar Goblin', '👺'], [80, 'Treat Titan', '🏆'], [130, 'Legend of Halloween', '👑']];
  const rank = ranks.filter(r => G.candy >= r[0]).pop();
  return {
    isEnd: true,
    enter() {
      const why = { home: 'You headed home early.', street: 'You reached the end of the street.', time: G.houses.every(h => h.visited) ? 'You visited every house on the street!' : "It's 10 PM — time to go home." }[reason];
      const d = el('div', 'end');
      const s = G.stats;
      d.innerHTML = `<h1>Night's Over</h1><div style="color:var(--muted)">${why}</div>
        <div class="big">🍬 ${G.candy}</div><div>${rank[2]} <b>${rank[1]}</b>${newBest ? ' · <span class="newunlock">NEW BEST!</span>' : ` · best ${SAVE.best}`}</div>
        <div style="margin-top:.5em;font-size:.9em">${G.mod.name} on ${G.street}</div>
        <div style="font-size:.9em;margin:.3em 0">${G.goals.map(g => `${G.goalsDone.has(g.id) ? '✅' : '❌'} ${g.text}`).join('<br>')}${goalBonus ? `<br><b>+${goalBonus} goal bonus</b>` : ''}</div>
        ${fresh.map(u => `<div class="newunlock">⭐ Unlocked: ${u.label}!</div>`).join('')}
        <table>
          <tr><td>Costume</td><td>${costumeName().replace(/</g, '&lt;')}</td></tr>
          <tr><td>Houses visited</td><td>${s.visited}</td></tr>
          <tr><td>Treats</td><td>${s.treats}</td></tr>
          <tr><td>Tricks</td><td>${s.tricks}</td></tr>
          <tr><td>Mini-games won / lost</td><td>${s.minigamesWon} / ${s.minigamesLost}</td></tr>
          <tr><td>Candy stolen</td><td>${s.lost}</td></tr>
          <tr><td>Times you screamed</td><td>${s.scares}</td></tr>
        </table>`;
      const again = el('button', null, '🎃 Play Again'); again.onclick = () => { SFX.click(); setScene(builderScene()); };
      d.appendChild(again); ui.appendChild(d);
      SFX.win();
    },
    update(dt) { t += dt; },
    draw() {
      drawSky(t); drawFarTrees(0, 470); ctx.fillStyle = '#0a0612'; ctx.fillRect(0, 470, W, 70);
      piles.forEach(p => { ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); rr(-6, -3, 12, 6, 3); ctx.restore(); });
      drawCostume(G.costume, 200, 500, 1.4, t, false, 1);
      drawFog(t, 1);
      vignette(0.6);
    },
  };
}

// ============================================================
//  INPUT + LOOP
// ============================================================
const keys = {}, vkeys = {};
const mouse = { x: W / 2, y: H / 2, moved: false };
addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if (e.target && e.target.blur) e.target.blur(); paused ? closePause() : openPause(); return; }
  if (e.target && e.target.tagName === 'INPUT') return;
  if (paused) return;
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (!keys[k]) { keys[k] = true; firstGesture(); scene.key && scene.key(k); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// screen point -> game coordinates, undoing the 90° rotation used on upright phones
function toLocal(e) {
  const r = wrap.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  if (ROTATED) { const tmp = dx; dx = -dy; dy = tmp; } // inverse of rotate(-90deg)
  return { x: (dx / GW + 0.5) * W, y: (dy / GH + 0.5) * H };
}
cv.addEventListener('pointermove', e => { const p = toLocal(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
addEventListener('pointerdown', firstGesture, true);
cv.addEventListener('pointerdown', e => { SFX.init(); const p = toLocal(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; if (!paused && scene.click) scene.click(p.x, p.y); });

let ROTATED = false, GW = 960, GH = 540;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  ROTATED = IS_TOUCH && vh > vw; // phone held upright: rotate the game so it is still landscape
  const lw = ROTATED ? vh : vw, lh = ROTATED ? vw : vh;
  GW = Math.min(lw, lh * 16 / 9); GH = GW * 9 / 16;
  Object.assign(wrap.style, { width: GW + 'px', height: GH + 'px', left: (vw - GW) / 2 + 'px', top: (vh - GH) / 2 + 'px', transform: ROTATED ? 'rotate(-90deg)' : 'none' }); // -90°: same way round as turning the phone to landscape
  // small touch screens get slightly larger text and buttons
  const fs = GW / 960 * 16 * (IS_TOUCH && GW < 900 ? 1.12 : 1);
  ui.style.fontSize = fs + 'px'; menuFab.style.fontSize = fs * 1.1 + 'px'; rotateHint.style.fontSize = fs * 0.75 + 'px';
  if (pauseEl) pauseEl.style.fontSize = fs + 'px';
  document.body.classList.toggle('rotated', ROTATED);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
// on phones, the first tap goes fullscreen and locks to landscape where the browser allows it
let triedFullscreen = false;
function goFullscreen() {
  const d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    const p = req.call(d, { navigationUI: 'hide' });
    const lock = () => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); };
    if (p && p.then) p.then(lock).catch(() => {}); else lock();
  } catch (e) { /* not supported */ }
}
addEventListener('contextmenu', e => e.preventDefault());
menuFab.onclick = () => { SFX.click(); openPause(); };

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  try { if (!paused && scene.update) scene.update(dt); ctx.setTransform(S, 0, 0, S, 0, 0); scene.draw(); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function applySavedSettings() {
  G.terror = SAVE.settings.terror !== false;
  SFX.muted = !!SAVE.settings.muted; if (SFX.master) SFX.master.gain.value = SFX.muted ? 0 : 0.6;
  if (SAVE.lastCostume) { G.costume = sanitizeCostume(SAVE.lastCostume); G.customName = SAVE.lastName || null; }
}
applySavedSettings();
writeSave(); // stores the upgraded save format right away
setScene(titleScene());
requestAnimationFrame(frame);
</script>
